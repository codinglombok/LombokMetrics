[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lombokmetrics"
version = "0.1.0"
description = "Zero-dependency metrics registry with Prometheus text exposition: counters, gauges, histograms, labels, canonical number formatting. Part of the Lombok Ecosystem."
license = "Apache-2.0 OR MIT"
requires-python = ">=3.10"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/lombokmetrics"]
